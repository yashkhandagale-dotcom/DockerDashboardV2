apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-dashboard-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-dashboard-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-dashboard-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: devops-dashboard-sa
    namespace: default
roleRef:
  kind: Role
  name: devops-dashboard-role
  apiGroup: rbac.authorization.k8s.io
