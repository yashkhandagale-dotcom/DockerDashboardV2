apiVersion: v1
kind: Service
metadata:
  name: devops-dashboard-service
  namespace: default
  labels:
    app: devops-dashboard
spec:
  selector:
    app: devops-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080    # explicit NodePort — avoids random assignment
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP   # Redis is internal-only — no NodePort needed
