apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-dashboard-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: devops-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 5000   # Only accept traffic on the app port
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379   # Allow outbound to Redis only
    - ports:
        - port: 443    # Allow K8s API server access (HTTPS)
        - port: 53     # Allow DNS resolution
        protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: devops-dashboard
      ports:
        - port: 6379   # Redis only accessible from the dashboard pods
