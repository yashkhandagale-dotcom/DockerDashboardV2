version: "3.9"

services:
  app:
    build: .
    image: devops-dashboard:local
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    volumes: []
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEPLOYMENT_NAME=devops-dashboard
      - NAMESPACE=default
      # FIX #4 — Explicitly tell the K8s client where to find the config
      - KUBECONFIG=/app/.kube/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data: